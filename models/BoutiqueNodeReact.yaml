                fileType: plaintext
              - name: README__md
                instanceOf: FileSystem:MarkdownFile
                text: >
                  # Boutique — Node + Express


                  Generated from the Node server `boutique` of the application

                  `Boutique`. Regenerated at each change of the model: edit the

                  model, not these files.


                  ## Run


                  1. A MongoDB server: `MONGO_URL` names it (default:
                  `mongodb://localhost:27017/db`).

                  2. `npm install`

                  3. `npm start` — the API listens on `http://localhost:3000`
                  (`PORT` changes it).


                  ## Resources


                  - `/api/documents` — Document

                  - `/api/clients` — Client

                  - `/api/commandes` — Commande

                  - `/api/lignedecommandes` — LigneDeCommande
              - name: src
                instanceOf: FileSystem:Folder
                entries:
                  - name: index__ts
                    instanceOf: FileSystem:TypeScriptFile
                    text: >
                      import express, {
                        type NextFunction,
                        type Request,
                        type Response
                      } from 'express'

                      import mongoose from 'mongoose'

                      import documentRouter from './routes/DocumentRouter.js'

                      import clientRouter from './routes/ClientRouter.js'

                      import commandeRouter from './routes/CommandeRouter.js'

                      import ligneDeCommandeRouter from
                      './routes/LigneDeCommandeRouter.js'


                      const app = express()

                      app.use(express.json())

                      app.use('/api/documents', documentRouter)

                      app.use('/api/clients', clientRouter)

                      app.use('/api/commandes', commandeRouter)

                      app.use('/api/lignedecommandes', ligneDeCommandeRouter)


                      app.use(
                        (error: Error, _req: Request, res: Response, _next: NextFunction) => {
                          if (error instanceof mongoose.Error.ValidationError) {
                            const errors = Object.fromEntries(
                              Object.entries(error.errors)
                                .map(([field, reason]) => [field, reason.kind])
                            )
                            res.status(400).json({ errors })
                            return
                          }
                          res.status(500).json({ error: error.message })
                        }
                      )


                      const mongoUrl =
                        process.env.MONGO_URL ?? 'mongodb://localhost:27017/db'
                      const port = Number(process.env.PORT ?? 3000)


                      await mongoose.connect(mongoUrl)

                      app.listen(port, () => {
                        console.log(`boutique listening on http://localhost:${port}`)
                      })
