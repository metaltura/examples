                  {
                    "compilerOptions": {
                      "target": "ES2022",
                      "module": "NodeNext",
                      "moduleResolution": "NodeNext",
                      "strict": true,
                      "esModuleInterop": true,
                      "skipLibCheck": true,
                      "outDir": "dist",
                      "rootDir": "src"
                    },
                    "include": ["src"]
                  }
                fileType: json
