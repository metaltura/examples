          - name: README__md
            instanceOf: FileSystem:MarkdownFile
            text: >
              # Boutique — Node + React


              Generated from the Node server `boutique` and the React frontend
              `web` of

              the application `Boutique`. Regenerated at each change of the
              model: edit the

              model, not these files.


              - `server/` — the API: Node + Express + MongoDB.

              - `client/` — the user interface: Vite + React + TypeScript.


              ## Run


              1. A MongoDB server: `server/README.md` says which one.

              2. `npm install` — installs both projects.

              3. `npm start` — the API listens on `http://localhost:3000`, the
              client opens
                 on `http://localhost:5173` and calls the API through Vite.

              `npm run typecheck` checks the types of both projects, `npm run
              build`

              builds them. Each project also runs alone: `npm start` in its
              folder.
          - name: __gitignore
            instanceOf: FileSystem:TextFile
            text: |
              node_modules
              dist
            fileType: plaintext
          - name: server
            instanceOf: FileSystem:Folder
            entries:
              - name: package__json
                instanceOf: FileSystem:TextFile
                text: |
                  {
                    "name": "boutique",
                    "version": "0.1.0",
