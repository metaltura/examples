                      import { StrictMode } from 'react'
                      import { createRoot } from 'react-dom/client'
                      import { BrowserRouter } from 'react-router'
                      import App from './App'
                      import './styles.css'

                      createRoot(document.getElementById('root')!).render(
                        <StrictMode>
                          <BrowserRouter>
                            <App />
                          </BrowserRouter>
                        </StrictMode>
                      )
                  - name: App__tsx
