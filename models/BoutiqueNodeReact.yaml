                    "type": "module",
                    "scripts": {
                      "start": "tsx src/index.ts",
                      "build": "tsc",
                      "typecheck": "tsc --noEmit"
                    },
                    "dependencies": {
                      "express": "5.1.0",
                      "mongoose": "8.9.5"
                    },
                    "devDependencies": {
                      "@types/express": "5.0.0",
