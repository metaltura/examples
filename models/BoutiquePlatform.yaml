                              },
                              LigneDeCommande: {
                                title: 'Ligne de commande'
                              },
                              route: {
                                Document: {
                                  entityScreen: {
                                    title: 'Documents'
                                  }
                                },
                                Client: {
                                  entityScreen: {
                                    title: 'Clients'
                                  }
                                },
                                Commande: {
                                  entityScreen: {
                                    title: 'Commandes'
                                  }
                                },
                                LigneDeCommande: {
                                  entityScreen: {
                                    title: 'Ligne de commandes'
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
              - name: server
                instanceOf: FileSystem:Folder
                entries:
                  - name: main__ts
                    instanceOf: FileSystem:TypeScriptFile
                    text: >
                      import { createServer, Logger } from
                      '@kogitec/core/server'

                      import { securityServerModule } from
                      '@kogitec/security/server'

                      // Declaring the schemas registers them: the platform
                      serves the documents

                      // of each one, which the lists and the forms read and
                      write.

                      import '../common/entities'


                      // `security` brings `socket` and `schema` with it.
                      Listens on PORT, else

                      // 8081; MongoDB and the sign-in are optional in
                      development.

                      createServer({ modules: [securityServerModule]
                      }).catch((error: unknown) => {
                        const message = error instanceof Error ? error.message : String(error)
                        Logger.error(`server not started: ${message}`)
                        process.exit(1)
                      })
