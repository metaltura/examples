              - name: server
                instanceOf: FileSystem:Folder
                entries:
                  - name: main__ts
                    instanceOf: FileSystem:TypeScriptFile
                    text: >
                      import { createServer, Logger } from
                      '@kogitec/core/server'

                      import { securityServerModule } from
                      '@kogitec/security/server'

                      // Declaring the schemas registers them: the platform
                      serves the documents

                      // of each one, which the lists and the forms read and
                      write.

                      import '../common/entities'

                      // The publications the screens subscribe to.

                      import './publications'


                      // `security` brings `socket` and `schema` with it.
                      Listens on PORT, else

                      // 8081; MongoDB and the sign-in are optional in
                      development.

                      createServer({ modules: [securityServerModule]
                      }).catch((error: unknown) => {
                        const message = error instanceof Error ? error.message : String(error)
                        Logger.error(`server not started: ${message}`)
                        process.exit(1)
                      })
                  - name: publications__ts
                    instanceOf: FileSystem:TypeScriptFile
                    text: >
                      // The publications the screens subscribe to, served as
                      the platform serves a

                      // modelled publication. Generated from the model: change
                      the model, not this file.

                      import { type DocSortKey, type FieldShape, type Schema,
                      SchemaUtil } from '@kogitec/schema/common'

                      import { DocAdapter } from '@kogitec/schema/server'

                      import { Client, Commande, Document, LigneDeCommande }
                      from '../common/entities'


                      // The order of the platform: the label of the entity,
                      then the key.

                      const byLabel = <Shape extends FieldShape>(schema:
                      Schema<Shape>): DocSortKey[] =>
                        [...new Set([SchemaUtil.labelField(schema), '_id'])].map((field) => ({ field, direction: 'asc' }))

                      DocAdapter.publishResolved('DocumentPublication', () => ({
                        schema: Document,
                        query: { sort: byLabel(Document), limit: 100 }
                      }))


                      DocAdapter.publishResolved('ClientPublication', () => ({
                        schema: Client,
                        query: { sort: byLabel(Client), limit: 100 }
                      }))


                      DocAdapter.publishResolved('CommandePublication', () => ({
                        schema: Commande,
                        query: { sort: byLabel(Commande), limit: 100 },
                        relations: { links: { clientId: {} } }
                      }))


                      DocAdapter.publishResolved('LigneDeCommandePublication',
                      () => ({
                        schema: LigneDeCommande,
                        query: { sort: byLabel(LigneDeCommande), limit: 100 }
                      }))
