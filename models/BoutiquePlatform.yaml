                      instanceOf: Platform:component.ElementValue
                      property: PlatformComponents:data.State.type
                      value:
                        - BoutiquePlatform:application.Client
                    - name: multiple
                      instanceOf: Platform:component.BooleanValue
                      property: PlatformComponents:data.State.multiple
                      value: true
                    - name: value
                      instanceOf: Platform:component.DocumentsValue
                      property: PlatformComponents:data.State.value
                      expression:
                        name: calcul
                        instanceOf: Platform:Expression
                        compute: |
                          export default (scope, docs) => docs
