                                                          instanceOf: Platform:component.ComponentInstance
                                                          component: PlatformComponents:infos.Text
                                                          values:
                                                            - name: text
                                                              instanceOf: Platform:component.I18nTextValue
                                                              property: PlatformComponents:infos.Text.text
                                                              expression:
                                                                name: expression
                                                                instanceOf: Platform:Expression
                                                                compute: >
                                                                  export default (scope) => { const member
                                                                  = (m: unknown): string => typeof m ===
                                                                  'string' ? m : typeof m === 'number' ?
                                                                  m.toLocaleString() : typeof m ===
                                                                  'boolean' ? String(m) : m instanceof
                                                                  Date ? new
                                                                  Intl.DateTimeFormat(undefined, {
                                                                  dateStyle: 'medium' }).format(m) : '';
                                                                  const v: unknown =
                                                                  scope.commande?.total; return typeof v
                                                                  === 'boolean' ? (v ? '✓' : '') :
                                                                  Array.isArray(v) ?
                                                                  v.map(member).filter((t) => t !==
                                                                  '').join(', ') : member(v) }
