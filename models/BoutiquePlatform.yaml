                                                BoutiquePlatform:application.CommandeList.documents
                                              expression:
                                                name: calcul
                                                instanceOf: Platform:Expression
                                                compute: >
                                                  export default (scope) =>
                                                  (scope.commandes ?? []).map((d) => ({
                                                  ...d, clientLabel: ((d as unknown as {
                                                  clientId?: string } |
                                                  undefined)?.clientId ? ((linked) =>
                                                  (linked ? linked.nom ?? '' : 'Document
                                                  supprimé'))((scope.clients ??
