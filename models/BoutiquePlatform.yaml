                                  }
                                }
                              }
                            }
                          }
                        },
                        en: {
                          boutique: {
                            boutique: {
                              title: 'Boutique',
                              Document: {
                                title: 'Document'
                              },
                              Client: {
                                title: 'Client'
                              },
                              Commande: {
