                                                                  'string' ? m : typeof m === 'number' ?
                                                                  m.toLocaleString() : typeof m ===
                                                                  'boolean' ? String(m) : m instanceof
                                                                  Date ? new
                                                                  Intl.DateTimeFormat(undefined, {
                                                                  dateStyle: 'medium' }).format(m) : '';
                                                                  const v: unknown = scope.commande?.date;
                                                                  return typeof v === 'boolean' ? (v ? '✓'
