        instanceOf: Mapping:Mapping
        mapper: EntitiesToPlatform:platform.entitiesToPlatform
        source: Trajets
        target: TrajetsPlatform:application
        mappedElements:
          - name: trajets
            instanceOf: Mapping:MappedElement
            element: TrajetsPlatform:application.trajets
            subMappedElements:
              - name: title
                instanceOf: Mapping:MappedElement
                element: TrajetsPlatform:application.trajets.title
                overriddenProperties: []
                deleted: false
              - name: Trajet
                instanceOf: Mapping:MappedElement
                element: TrajetsPlatform:application.trajets.Trajet
                subMappedElements:
                  - name: title
                    instanceOf: Mapping:MappedElement
                    element: TrajetsPlatform:application.trajets.Trajet.title
                    overriddenProperties: []
                    deleted: false
                overriddenProperties: []
                deleted: false
                overriddenOrders: []
