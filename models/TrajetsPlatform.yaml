                element: TrajetsPlatform:application.trajets.route
                subMappedElements:
                  - name: Trajet
                    instanceOf: Mapping:MappedElement
                    element: TrajetsPlatform:application.trajets.route.Trajet
                    subMappedElements:
                      - name: entityScreen
                        instanceOf: Mapping:MappedElement
                        element: >-
                          TrajetsPlatform:application.trajets.route.Trajet.entityScreen
                        subMappedElements:
                          - name: title
                            instanceOf: Mapping:MappedElement
                            element: >-
                              TrajetsPlatform:application.trajets.route.Trajet.entityScreen.title
                            subMappedElements:
                              - name: title
                                instanceOf: Mapping:MappedElement
                                element: >-
                                  TrajetsPlatform:application.trajets.route.Trajet.entityScreen.title.title
                                overriddenProperties: []
                                deleted: false
                            overriddenProperties: []
                            deleted: false
                            overriddenOrders: []
                          - name: entity
                            instanceOf: Mapping:MappedElement
                            element: >-
                              TrajetsPlatform:application.trajets.route.Trajet.entityScreen.entity
                            subMappedElements: []
                            overriddenProperties: []
                            deleted: false
                        overriddenProperties: []
                        deleted: false
                        overriddenOrders: []
                    overriddenProperties: []
                    deleted: false
                    overriddenOrders: []
                overriddenProperties: []
                deleted: false
                overriddenOrders: []
            overriddenProperties: []
            deleted: false
            overriddenOrders: []
        overriddenOrders: []
