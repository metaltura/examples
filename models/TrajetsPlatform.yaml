                      ? '✓' : '') : Array.isArray(v) ? v.map(member).filter((t)
                      => t !== '').join(', ') : member(v) }) satisfies (scope:
                      TrajetScreenScope) => unknown

                      const siSupprimeCondition = ((scope) => !!scope.selected)
                      satisfies (scope: TrajetScreenScope) => unknown

                      const siModifiableCondition = ((scope) => !!scope.trajet)
                      satisfies (scope: TrajetScreenScope) => unknown


                      export const TrajetScreen = ({ selected, onChange }:
                      TrajetScreenProps) => {
                        const services = useDocServices()
                        useDocSubscriptionResult(trajetPublication)
                        const trajetDocs = useDocsByLabel(Trajet)
                        const trajets = useMemo(() => trajetsValue({ selected }, trajetDocs), [selected, trajetDocs])
                        const trajetComputed = useMemo(() => trajetValue({ selected, trajets }, trajetDocs), [selected, trajets, trajetDocs])
