                      (v ? '✓' : '') : Array.isArray(v) ?
                      v.map(member).filter((t) => t !== '').join(', ') :
                      member(v) }) satisfies (scope: TrajetScreenScope) =>
                      unknown

                      const optionsText = ((scope) => { const member = (m:
                      unknown): string => typeof m === 'string' ? m : typeof m
                      === 'number' ? m.toLocaleString() : typeof m === 'boolean'
                      ? String(m) : m instanceof Date ? new
                      Intl.DateTimeFormat(undefined, { dateStyle: 'medium'
                      }).format(m) : ''; const v: unknown =
