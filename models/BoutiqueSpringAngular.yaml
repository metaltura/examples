                        padding: 0.375rem 0.75rem;
                        border-radius: 4px;
                        color: inherit;
                        text-decoration: none;
                        opacity: 0.85;
                      }

                      nav a:hover {
                        background: rgb(255 255 255 / 12%);
                        opacity: 1;
                      }

                      nav a.active {
                        font-weight: 600;
                        background: rgb(255 255 255 / 20%);
                        opacity: 1;
                      }

                      main {
                        max-width: 1100px;
                        margin: 0 auto;
                        padding: 2rem 1.5rem;
                      }

                      section {
                        padding: 1.5rem 2rem;
                        border: 1px solid var(--border);
                        border-radius: 8px;
                        background: #fff;
                        box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
                      }

                      h1 {
                        margin: 0 0 1.25rem;
                        font-size: 1.5rem;
                        font-weight: 600;
                      }

                      table {
                        width: 100%;
                        margin-top: 1.25rem;
                        border-collapse: collapse;
