                                `numero` VARCHAR(255) NOT NULL,
                                `clientId` CHAR(36) NOT NULL,
                                PRIMARY KEY (`id`),
                                FOREIGN KEY (`clientId`) REFERENCES `Client` (`id`)
                              );


                              CREATE TABLE IF NOT EXISTS `LigneDeCommande` (
