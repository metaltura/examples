                        flex-wrap: wrap;
                        gap: 0.25rem;
                        align-items: center;
                        padding: 0.5rem 1.5rem;
                        color: #fff;
                        background: #37474f;
                        box-shadow: 0 2px 4px rgb(0 0 0 / 20%);
