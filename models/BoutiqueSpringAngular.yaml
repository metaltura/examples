                              -- The schema of the database db, generated from
                              the model.

                              -- Played by Spring at start, checked by
                              Hibernate.


                              CREATE TABLE IF NOT EXISTS `Document` (
                                `id` CHAR(36) NOT NULL,
                                `numero` VARCHAR(255) NOT NULL,
                                PRIMARY KEY (`id`)
                              );


                              CREATE TABLE IF NOT EXISTS `Client` (
