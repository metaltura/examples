                        padding: 0.5rem 0.625rem;
                        border: 1px solid #c3cad3;
                        border-radius: 4px;
                        font: inherit;
                        font-weight: normal;
                        background: #fff;
                      }

                      form input[type="checkbox"] {
                        justify-self: start;
                        width: auto;
                      }

                      form input:focus,
                      form select:focus,
                      form textarea:focus {
                        border-color: var(--primary);
                        outline: 2px solid var(--primary);
                        outline-offset: -1px;
                      }

                      button,
                      section > a,
                      section > p > a {
                        display: inline-block;
                        padding: 0.5rem 1rem;
                        border: 1px solid var(--primary);
                        border-radius: 4px;
                        font: inherit;
                        font-weight: 600;
                        line-height: 1.25;
                        text-decoration: none;
                        cursor: pointer;
                      }

                      button,
                      section > a {
                        color: #fff;
                        background: var(--primary);
                      }

                      button:hover,
                      section > a:hover {
                        filter: brightness(0.9);
                      }

                      form button {
                        justify-self: start;
                      }

                      section > p:not(.error) {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 0.75rem;
                        margin: 0;
                      }

                      section > p > a {
                        color: var(--primary);
                        background: transparent;
                      }

                      section > p > a:hover {
                        background: #e8f0fb;
                      }

                      section > p > button {
                        margin-left: auto;
                        border-color: var(--danger);
                        color: var(--danger);
                        background: transparent;
                      }

                      section > p > button:hover {
                        filter: none;
                        background: #fdecea;
                      }

                      .error {
                        padding: 0.75rem 1rem;
                        border: 1px solid #f5c2c0;
                        border-radius: 4px;
                        color: var(--danger);
                        background: #fdecea;
                      }
