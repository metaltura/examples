  - name: code
    instanceOf: Core:Package
    elements:
      - name: boutique-spring
        instanceOf: FileSystem:SystemFolder
        entries:
          - name: README__md
            instanceOf: FileSystem:MarkdownFile
            text: >
              # Boutique — Spring Boot + Angular


              Generated from the Spring context `boutique` and the Angular
              frontend `web`

              of the application `Boutique`. Regenerated at each change

              of the model: edit the model, not these files.


              - `server/` — the API: Spring Boot + JPA + MariaDB, built by
              Maven.

              - `client/` — the user interface: Angular.

              - `docker-compose.yml` — the MariaDB database.


              ## Prerequisites


              Java 17+, Maven 3.9, Docker with Compose, and Node 22.22.3+ or
              24.15+.


              ## Run


              1. `docker compose up -d` — MariaDB listens on
                 `localhost:3306` with an empty database `db`.
              2. In `server/`: `mvn spring-boot:run` — the API listens on
                 `http://localhost:8080` and creates the tables at start. A
                 database just started may refuse the first connection: wait
                 a few seconds and run it again.
              3. In `client/`: `npm install` then `npm start` — the client
                 opens on `http://localhost:4200` and calls the API through
                 the dev server of Angular.

              `docker compose down` stops the database and removes it with its

              data. After a field is added to the model, it is how the tables

              are created again: `docker compose down` then

              `docker compose up -d`.
          - name: __gitignore
            instanceOf: FileSystem:TextFile
            text: |
              target
              node_modules
              dist
              .angular
            fileType: plaintext
          - name: docker-compose__yml
            instanceOf: FileSystem:TextFile
            text: |
              services:
                mariadb:
                  image: mariadb:11
                  environment:
                    MARIADB_DATABASE: db
                    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
                  ports:
                    - "3306:3306"
            fileType: yaml
          - name: server
            instanceOf: FileSystem:Folder
            entries:
              - name: pom__xml
                instanceOf: FileSystem:TextFile
                text: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <project xmlns="http://maven.apache.org/POM/4.0.0"
                           xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                           xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
                    <modelVersion>4.0.0</modelVersion>
                    <parent>
                      <groupId>org.springframework.boot</groupId>
                      <artifactId>spring-boot-starter-parent</artifactId>
                      <version>3.3.5</version>
                      <relativePath/>
                    </parent>
                    <groupId>com.example.boutique</groupId>
                    <artifactId>boutique</artifactId>
                    <version>0.1.0</version>
                    <name>boutique</name>
                    <properties>
                      <java.version>17</java.version>
                    </properties>
                    <dependencies>
                      <dependency>
                        <groupId>org.springframework.boot</groupId>
                        <artifactId>spring-boot-starter-web</artifactId>
                      </dependency>
                      <dependency>
                        <groupId>org.springframework.boot</groupId>
                        <artifactId>spring-boot-starter-data-jpa</artifactId>
                      </dependency>
                      <dependency>
